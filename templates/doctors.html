<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
    <style>
        body { font-family: Arial; background: #eef5fb; text-align: center; margin: 0; }
        .top { background: #1a73e8; color: white; padding: 20px; }
        .box { margin: 40px auto; width: 700px; background: white; padding: 30px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #1a73e8; color: white; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 16px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .book { background: #1a73e8; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="top">
        <h1>City Clinic</h1>
    </div>
    <div class="box">
        <h3>Our Doctors</h3>
        <form method="GET">
            <input type="text" name="specialty" placeholder="Search by specialty" value="{{ search }}">
            <button type="submit">Search</button>
        </form>
        <table>
            <tr><th>Name</th><th>Specialty</th><th>Fees (₹)</th><th>Action</th></tr>
            {% for d in doctors %}
            <tr>
                <td>{{ d['name'] }}</td>
                <td>{{ d['specialty'] }}</td>
                <td>{{ d['fees'] }}</td>
                <td>
                    {% if session.get('role') == 'patient' %}
                    <a class="book" href="/book/{{ d['id'] }}">Book</a>
                    {% endif %}
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4">No doctors found.</td></tr>
            {% endfor %}
        </table>
        <p><a href="/dashboard">Back to dashboard</a></p>
    </div>
</body>
</html>
