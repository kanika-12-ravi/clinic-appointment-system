<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial; background: #eef5fb; text-align: center; margin: 0; }
        .top { background: #1a73e8; color: white; padding: 20px; }
        .box { margin: 40px auto; width: 400px; background: white; padding: 30px; border-radius: 10px; }
        a { display: block; margin: 12px 0; padding: 12px; background: #1a73e8; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="top">
        <h1>City Clinic</h1>
    </div>
    <div class="box">
        <h3>Welcome, {{ name }}!</h3>
        <p>You are logged in as: {{ role }}</p>
        <a href="/doctors">View Doctors</a>
        {% if role == 'patient' %}
        <a href="/my-appointments">My Appointments</a>
        {% endif %}
        {% if role == 'doctor' %}
        <a href="/doctor">My Patients' Appointments</a>
        {% endif %}
        {% if role == 'admin' %}
        <a href="/admin">Admin Panel</a>
        {% endif %}
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
